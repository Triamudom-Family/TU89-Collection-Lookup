<!doctype html>
<html>

<head>
	<base target="_top" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap");

		body {
			font-family: "IBM Plex Sans Thai", sans-serif;
			overscroll-behavior: none;
		}

		.mono {
			font-family: "JetBrains Mono", monospace;
			font-weight: 600;
		}

		.blob {
			position: fixed;
			border-radius: 50%;
			filter: blur(80px);
			opacity: 0.35;
			pointer-events: none;
			z-index: 0;
		}

		.glass-card {
			background: rgba(255, 255, 255, 0.72);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1.5px solid rgba(255, 255, 255, 0.9);
			box-shadow:
				0 4px 32px rgba(236, 72, 153, 0.1),
				0 1.5px 8px rgba(236, 72, 153, 0.06),
				inset 0 1px 0 rgba(255, 255, 255, 0.8);
		}

		.type-card {
			background: rgba(255, 255, 255, 0.72);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1.5px solid rgba(255, 255, 255, 0.9);
			box-shadow: 0 2px 16px rgba(236, 72, 153, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
			transition: all 0.18s ease;
		}

		.type-card:hover {
			box-shadow: 0 8px 28px rgba(236, 72, 153, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
			transform: translateY(-2px);
		}

		.type-card:active {
			transform: scale(0.97);
			box-shadow: 0 2px 10px rgba(236, 72, 153, 0.1);
		}

		.input-wrap {
			display: flex;
			align-items: stretch;
			border-radius: 1rem;
			border: 2px solid #fbcfe8;
			background: rgba(255, 255, 255, 0.8);
			transition: border-color 0.15s ease, box-shadow 0.15s ease;
		}

		.input-wrap:focus-within {
			border-color: #f472b6;
			box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.18);
		}

		.input-wrap.state-success { border-color: #86efac; }
		.input-wrap.state-warn    { border-color: #fcd34d; }
		.input-wrap.state-error   { border-color: #fca5a5; }

		@keyframes fadeUp {
			from { opacity: 0; transform: translateY(18px); }
			to   { opacity: 1; transform: translateY(0); }
		}

		.fade-up { animation: fadeUp 0.55s cubic-bezier(0.22, 0.68, 0, 1.2) both; }
		.fade-up-1 { animation-delay: 0.05s; }
		.fade-up-2 { animation-delay: 0.13s; }
		.fade-up-3 { animation-delay: 0.22s; }
		.fade-up-4 { animation-delay: 0.3s; }
		.fade-up-5 { animation-delay: 0.38s; }

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(8px); }
			to   { opacity: 1; transform: translateY(0); }
		}

		.fade-in { animation: fadeIn 0.3s ease both; }

		#resultCard:not(.hidden) { display: flex; }
		#errorBox:not(.hidden)   { display: flex; }
		#spinner:not(.hidden)    { display: flex; }
	</style>
</head>

<body class="bg-gradient-to-br from-rose-50 via-pink-100 to-pink-200 overflow-x-hidden" style="min-height: 100dvh">
	<div class="blob" style="width:420px;height:420px;background:#f9a8d4;top:-80px;left:-100px;"></div>
	<div class="blob" style="width:320px;height:320px;background:#fbcfe8;bottom:-60px;right:-60px;"></div>
	<div class="blob" style="width:200px;height:200px;background:#fde68a;bottom:80px;left:30px;opacity:0.18;"></div>

	<!-- ===== SELECTOR SCREEN ===== -->

					<div class="w-14 h-14 rounded-xl bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center flex-shrink-0 shadow-lg shadow-pink-200/60">

			<span>|</span>
			<span>ID Lookup - δ · v3.0.0</span>

	</section>

	<!-- ===== SEARCH SCREEN ===== -->
	<section id="searchScreen" class="hidden relative z-10 flex flex-col items-center justify-center w-full min-h-dvh px-6 sm:px-5 py-10">
		<div class="glass-card rounded-3xl w-full max-w-md mx-auto px-7 sm:px-8 pt-6 pb-6 flex flex-col gap-7 fade-up fade-up-1">

			<button onclick="goBack()" class="self-start flex items-center gap-1 text-xs text-pink-300 hover:text-pink-500 transition-colors">
				<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
				เปลี่ยนประเภท

			<header class="flex flex-col items-center gap-1 fade-up fade-up-2">
				<div id="typeIconWrap" class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg mb-2"></div>
				<h1 class="text-2xl font-bold tracking-tight text-pink-700">
					<span id="typeLabel"></span>
				</h1>
				<p class="text-xs text-pink-400 font-light tracking-wide text-center">กรอกเลขที่สมาชิก 4 หลักเพื่อค้นหาข้อมูล</p>
			</header>

			<div class="flex flex-col gap-5 fade-up fade-up-3">
				<div class="flex flex-col gap-1.5">
					<label class="text-pink-400 font-medium text-xs tracking-widest block pl-1">เลขที่สมาชิก</label>
					<div class="input-wrap justify-center" id="membershipInputWrap">
						<span class="mono text-pink-300 text-xl pr-0.5 flex items-center select-none tracking-widest">89-</span>

							<path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
						</svg>
						<span class="sr-only">Loading...</span>
					</div>
				</div>

				<div id="resultCard" class="hidden flex-col gap-3 py-4 px-5 rounded-2xl bg-pink-50 border border-pink-200">

				</div>

				<div id="errorBox" class="hidden items-center gap-3 px-5 py-4 rounded-2xl bg-amber-100 border-2 border-amber-400">

	<script>
		let currentType = null;
		let searchId = 0;

		const TYPES = {
			bag: {
				label: 'กระเป๋า',
				gradient: 'from-violet-400 to-purple-500',
				shadow: 'shadow-violet-200/60',
				icon: `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
			},
			polo: {
				label: 'เสื้อโปโล',
				gradient: 'from-teal-400 to-emerald-500',
				shadow: 'shadow-teal-200/60',
				icon: `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>`,
			},
			jersey: {
				label: 'เสื้อ Jersey',
				gradient: 'from-pink-400 to-rose-500',
				shadow: 'shadow-pink-200/60',
				icon: `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/><line x1="9" y1="15" x2="15" y2="15"/></svg>`,
			},
		};

		function selectType(type) {
			currentType = type;
			const cfg = TYPES[type];

			document.getElementById('selectorScreen').classList.add('hidden');
			document.getElementById('searchScreen').classList.remove('hidden');

			const wrap = document.getElementById('typeIconWrap');
			wrap.className = `w-14 h-14 rounded-2xl bg-gradient-to-br ${cfg.gradient} flex items-center justify-center shadow-lg ${cfg.shadow} mb-2`;
			wrap.innerHTML = cfg.icon;

			document.getElementById('typeLabel').textContent = cfg.label;
			setTimeout(() => document.getElementById('membershipInput').focus(), 80);
		}

		function goBack() {
			currentType = null;
			document.getElementById('membershipInput').value = '';
			resetResult();
			document.getElementById('searchScreen').classList.add('hidden');
			document.getElementById('selectorScreen').classList.remove('hidden');
		}

		function handleMembershipInput(input) {
			input.value = input.value.replace(/\D/g, '').slice(0, 4);
			resetResult();
			if (input.value.length === 4) doSearch(input.value);
		}

		function doSearch(digits) {
			const sid = ++searchId;
			document.getElementById('spinner').classList.remove('hidden');

			google.script.run
				.withSuccessHandler((res) => {
					if (sid !== searchId) return;
					document.getElementById('spinner').classList.add('hidden');
					if (res.found) showResult(res);
					else showNotFound('ไม่พบข้อมูล กรุณาตรวจสอบเลขที่สมาชิก');
				})
				.withFailureHandler(() => {
					if (sid !== searchId) return;
					document.getElementById('spinner').classList.add('hidden');
					showError('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
				})
				.findByMembershipId(digits);
		}

		function showResult(res) {
			let dataHtml = '';
			let isCollected = false;

			if (currentType === 'polo') {
				isCollected = !!res.poloCollected;
				dataHtml = `<div class="grid grid-cols-2 gap-2.5">
					${infoCard('ไซส์เสื้อโปโล', res.poloSize)}
					${infoCard('เพศเสื้อโปโล', res.poloGender)}
				</div>`;
			} else if (currentType === 'jersey') {
				isCollected = !!res.jerseyCollected;
				dataHtml = `
					<div class="grid grid-cols-2 gap-2.5">
						${infoCard('ไซส์เสื้อ Jersey', res.jerseySize)}
						${infoCard('ตัวเลขบนเสื้อ', res.jerseyNumber)}
					</div>
					${infoCard('ตัวอักษรบนเสื้อ', res.jerseyText)}
				`;
			} else if (currentType === 'bag') {
				isCollected = !!res.bagCollected;
			}

			const card = document.getElementById('resultCard');
			card.innerHTML = `
				${dataHtml}
				<div class="${dataHtml ? 'border-t border-pink-200 pt-1' : ''}">
					${toggleBtn(isCollected, res.membershipId)}
				</div>
			`;
			card.classList.remove('hidden');
			card.classList.add('fade-in');

			document.getElementById('membershipInputWrap').classList.add('state-success');
		}

		function infoCard(label, value) {
			return `<div class="rounded-xl bg-white/60 border border-pink-100 px-3 py-2.5 flex flex-col gap-0.5">
				<span class="text-xs text-pink-400 font-medium">${label}</span>
				<span class="mono text-base font-bold text-pink-700">${value ?? '-'}</span>
			</div>`;
		}

		function toggleBtn(collected, membershipId) {
			const base = 'w-full py-2.5 px-4 rounded-xl border-2 font-semibold text-sm transition-all flex items-center justify-center gap-2 active:scale-[0.98]';
			const color = collected
				? 'bg-green-50 border-green-200 text-green-600 hover:bg-green-100'
				: 'bg-pink-50 border-pink-200 text-pink-400 hover:bg-pink-100';
			const icon = collected
				? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`
				: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>`;
			const label = collected ? 'รับแล้ว' : 'ยังไม่ได้รับ';
			const safeId = membershipId.replace(/"/g, '&quot;');
			return `<button id="toggleBtn" onclick="toggleStatus('${safeId}')" class="${base} ${color}">${icon}${label}</button>`;
		}

		function toggleBtnUpdating() {
			const btn = document.getElementById('toggleBtn');
			if (!btn) return;
			btn.disabled = true;
			btn.className = 'w-full py-2.5 px-4 rounded-xl border-2 font-semibold text-sm flex items-center justify-center gap-2 bg-gray-50 border-gray-200 text-gray-400 cursor-wait';
			btn.innerHTML = `<svg class="animate-spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>กำลังแก้ไข...`;
		}

		function toggleBtnError(previousCollected, membershipId) {
			const btn = document.getElementById('toggleBtn');
			if (!btn) return;
			btn.disabled = true;
			btn.className = 'w-full py-2.5 px-4 rounded-xl border-2 font-semibold text-sm flex items-center justify-center gap-2 bg-red-50 border-red-200 text-red-400';
			btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>เกิดข้อผิดพลาด`;
			setTimeout(() => {
				const wrap = btn.parentElement;
				if (wrap) wrap.innerHTML = toggleBtn(previousCollected, membershipId);
			}, 2000);
		}

		function toggleStatus(membershipId) {
			const btn = document.getElementById('toggleBtn');
			if (!btn || btn.disabled) return;

			const previousCollected = btn.textContent.trim().startsWith('รับแล้ว');
			toggleBtnUpdating();

			google.script.run
				.withSuccessHandler((res) => {
					const wrap = document.getElementById('toggleBtn')?.parentElement;
					if (!wrap) return;
					if (res.success) {
						wrap.innerHTML = toggleBtn(res.newStatus, membershipId);
					} else {
						toggleBtnError(previousCollected, membershipId);
					}
				})
				.withFailureHandler(() => {
					toggleBtnError(previousCollected, membershipId);
				})
				.toggleCollectedStatus(membershipId, currentType);
		}

		function resetResult() {
			document.getElementById('resultCard').classList.add('hidden');
			document.getElementById('errorBox').classList.add('hidden');
			document.getElementById('spinner').classList.add('hidden');

			const input = document.getElementById('membershipInput');
			input.classList.remove('text-green-500', 'text-amber-500', 'text-red-500');
			input.classList.add('text-pink-700');

			const wrap = document.getElementById('membershipInputWrap');
			wrap.classList.remove('state-success', 'state-warn', 'state-error');

			const box = document.getElementById('errorBox');
			box.classList.remove('border-red-400', 'bg-red-100');
			box.classList.add('border-amber-400', 'bg-amber-100');
			document.getElementById('errorText').classList.remove('text-red-600');
			document.getElementById('errorText').classList.add('text-amber-500');
			document.getElementById('errorIcon').classList.remove('bg-red-100');
			document.getElementById('errorIcon').classList.add('bg-amber-100');
			box.querySelector('svg').setAttribute('stroke', '#f59e0b');
		}

		function showNotFound(msg) {
			document.getElementById('errorText').textContent = msg;
			document.getElementById('errorBox').classList.remove('hidden');
			document.getElementById('membershipInputWrap').classList.add('state-warn');
		}

		function showError(msg) {
			const box = document.getElementById('errorBox');
			box.classList.remove('border-amber-400', 'bg-amber-100');
			box.classList.add('border-red-400', 'bg-red-100');
			document.getElementById('errorText').textContent = msg;
			document.getElementById('errorText').classList.remove('text-amber-500');
			document.getElementById('errorText').classList.add('text-red-600');
			document.getElementById('errorIcon').classList.remove('bg-amber-100');
			document.getElementById('errorIcon').classList.add('bg-red-100');
			box.querySelector('svg').setAttribute('stroke', '#ef4444');
			box.classList.remove('hidden');
			document.getElementById('membershipInputWrap').classList.add('state-error');
		}
	</script>
</body>

</html>
